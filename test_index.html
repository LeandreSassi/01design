<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>01Design — 3D test</title>
    <link href="assets/css/StyleSheet.css" rel="stylesheet" />
    <style>
        html, body { margin: 0; height: 100%; overflow: hidden; }
        #scene { position: fixed; inset: 0; display: block; }

        #topbar {
            position: fixed; top: 0; left: 0; right: 0; z-index: 10;
            display: flex; align-items: center; gap: 16px; padding: 8px 16px;
            background: color-mix(in srgb, var(--color-bg) 88%, black);
            box-shadow: 0 2px 12px rgba(0,0,0,0.25);
        }
        #title-badge { font-weight: 700; font-size: 22px; letter-spacing: 0.02em; flex: none; }
        #topbar .filter-btn { margin: 2px; padding: 6px 12px; font-size: 14px; }

        #scale-control {
            display: flex; align-items: center; gap: 8px; flex: none;
            font-size: 13px; letter-spacing: 0.02em; margin-left: auto;
        }
        #scale-control input[type="range"] { width: 140px; accent-color: var(--color-text); }

        #hint {
            position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
            font-size: 13px; letter-spacing: 0.04em; opacity: 0.65;
            pointer-events: none; user-select: none; text-align: center;
        }
        #tooltip {
            position: fixed; pointer-events: none; z-index: 10;
            padding: 6px 10px; border-radius: 4px; font-size: 14px; font-weight: 700;
            background: color-mix(in srgb, var(--color-bg) 70%, black);
            border: 1px solid color-mix(in srgb, var(--color-text) 40%, transparent);
            transform: translate(-50%, -140%); white-space: nowrap;
            opacity: 0; transition: opacity 0.12s ease;
        }
        #scene-modal-root .modal { display: none; }

        /* Hover preview: a mini project card, docked right (landscape) / bottom (portrait) */
        #hover-preview {
            position: fixed; z-index: 9; pointer-events: none;
            opacity: 0; transition: opacity 0.15s ease;
        }
        @media (orientation: landscape) {
            #hover-preview { top: 50%; right: 28px; transform: translateY(-50%); }
        }
        @media (orientation: portrait) {
            #hover-preview { bottom: 28px; left: 50%; transform: translateX(-50%); }
        }
        #preview-card {
            width: 190px; height: 190px;
            background-size: cover; background-position: center;
            border-radius: 3px; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            text-align: center; font-weight: 700;
            box-shadow: 0 0 24px rgba(0,0,0,0.4);
        }
        #preview-card p {
            width: 100%; margin: 0; padding: 8px 6px;
            font-size: 15px; color: var(--color-text);
            background-color: color-mix(in srgb, var(--color-bg) 55%, transparent);
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>
    <canvas id="scene"></canvas>

    <div id="topbar">
        <div id="title-badge">01Design</div>
        <button id="reset-rows" class="filter-btn">Show all</button>
    </div>
    <div id="tooltip"></div>
    <div id="hover-preview">
        <div id="preview-card"><p id="preview-title"></p></div>
    </div>
    <div id="hint">drag to orbit &nbsp;•&nbsp; scroll to zoom &nbsp;•&nbsp; click a row name to hide/show it &nbsp;•&nbsp; click a cube to open</div>

    <div id="scene-modal-root"></div>

    <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
        "three-mesh-bvh": "https://unpkg.com/three-mesh-bvh@0.7.6/build/index.module.js",
        "three-bvh-csg": "https://unpkg.com/three-bvh-csg@0.0.17/build/index.module.js",
        "lil-gui": "https://unpkg.com/lil-gui@0.19/dist/lil-gui.esm.js"
      }
    }
    </script>

    <script type="module">
        // Cache-bust every load — during active dev, a stale cached ES module
        // graph is a much more confusing bug than a wasted network request.
        import('./assets/js/3d/main.js?v=' + Date.now());
    </script>
</body>
</html>
